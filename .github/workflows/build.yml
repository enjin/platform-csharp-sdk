name: Build, Test & Package

on:
  push:
    branches:
      - master
    tags:
      - '*'
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Packages
        run: dotnet restore ./src/Enjin.Platform.Sdk/Enjin.Platform.Sdk.sln

      - name: Restore .NET Tools
        run: dotnet tool restore

      - name: Verify Formatting (CSharpier)
        run: dotnet csharpier check ./src

      - name: Verify Formatting (dotnet format)
        run: dotnet format ./src/Enjin.Platform.Sdk/Enjin.Platform.Sdk.sln --verify-no-changes --no-restore --severity info

      - name: Build Solution
        run: dotnet build ./src/Enjin.Platform.Sdk/Enjin.Platform.Sdk.sln --configuration Release --no-restore

      - name: Run Tests
        run: dotnet test ./src/Enjin.Platform.Sdk/Enjin.Platform.Sdk.sln --configuration Release --no-build --verbosity normal

      - name: Build NuGet Packages
        run: dotnet pack ./src/Enjin.Platform.Sdk/Enjin.Platform.Sdk/Enjin.Platform.Sdk.csproj --configuration Release --no-build --output ./src/Enjin.Platform.Sdk/nuget-packages/

      - name: Upload Artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ./src/Enjin.Platform.Sdk/nuget-packages/*.nupkg
