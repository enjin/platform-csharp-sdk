name: Build, Test & Package

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read    # checkout
      id-token: write   # mint GitHub OIDC token for NuGet trusted publishing
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Packages
        run: dotnet restore ./src/Enjin.Platform.Sdk/Enjin.Platform.Sdk.sln

      - name: Restore .NET Tools
        run: dotnet tool restore

      - name: Verify Formatting (CSharpier)
        run: dotnet csharpier check ./src

      - name: Verify Formatting (dotnet format)
        run: dotnet format ./src/Enjin.Platform.Sdk/Enjin.Platform.Sdk.sln --verify-no-changes --no-restore

      - name: Build Solution
        run: dotnet build ./src/Enjin.Platform.Sdk/Enjin.Platform.Sdk.sln --configuration Release --no-restore

      - name: Run Tests
        run: dotnet test ./src/Enjin.Platform.Sdk/Enjin.Platform.Sdk.sln --configuration Release --no-build --verbosity normal

      - name: Build NuGet Packages
        run: dotnet pack ./src/Enjin.Platform.Sdk/Enjin.Platform.Sdk/Enjin.Platform.Sdk.csproj --configuration Release --no-build --output ./src/Enjin.Platform.Sdk/nuget-packages/

      - name: NuGet login (OIDC -> temp API key)
        id: nuget-login
        if: startsWith(github.ref, 'refs/tags/v')
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet.org
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          dotnet nuget push ./src/Enjin.Platform.Sdk/nuget-packages/*.nupkg \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
